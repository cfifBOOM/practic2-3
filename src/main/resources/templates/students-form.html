<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Добавить студента</title></head>
<body>
<h1>Добавить студента</h1>
<form th:action="@{/students/add}" th:object="${student}" method="post">
    <p>Имя: <input type="text" th:field="*{name}"></p>
    <p>Курс: <input type="number" th:field="*{course}"></p>
    <p>Есть задолженность: <input type="checkbox" th:field="*{hasDebt}"></p>
    <button type="submit">Сохранить</button>
</form>
<a href="/students">Назад к списку</a>
</body>
</html>
